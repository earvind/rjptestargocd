apiVersion: kustomize.config.k8s.io/v1beta1

kind: Kustomization



bases:

  - ../../base



namespace: production

namePrefix: prod-



commonLabels:

  environment: production



configMapGenerator:

  - name: my-app-config

    behavior: merge

    literals:

      - APP_ENV=production

      - LOG_LEVEL=error

      - MAX_CONNECTIONS=500



# Production also adds an HPA

resources:

  - patch-hpa.yaml



patches:

  - path: patch-replicas.yaml

  - path: patch-resources.yaml
