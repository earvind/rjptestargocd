apiVersion: kustomize.config.k8s.io/v1beta1

kind: Kustomization



# Point to base

bases:

  - ../../base



# Add dev namespace

namespace: dev



# Prefix all resource names

namePrefix: dev-



# Add dev-specific labels

commonLabels:

  environment: dev



# Override ConfigMap values

configMapGenerator:

  - name: my-app-config

    behavior: merge

    literals:

      - APP_ENV=development

      - LOG_LEVEL=debug

      - MAX_CONNECTIONS=10



# Apply patches

patches:

  - path: patch-replicas.yaml
