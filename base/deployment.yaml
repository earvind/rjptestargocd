apiVersion: apps/v1

kind: Deployment

metadata:

  name: my-app

  labels:

    app: my-app

spec:

  replicas: 1

  selector:

    matchLabels:

      app: my-app

  template:

    metadata:

      labels:

        app: my-app

    spec:

      containers:

        - name: my-app

          image: nginx:1.25

          ports:

            - containerPort: 80

          env:

            - name: APP_ENV

              valueFrom:

                configMapKeyRef:

                  name: my-app-config

                  key: APP_ENV

          resources:

            requests:

              cpu: "100m"

              memory: "128Mi"

            limits:

              cpu: "200m"

              memory: "256Mi"
